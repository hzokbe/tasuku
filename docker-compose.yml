services:
  tasuku-db:
    container_name: tasuku-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-tasuku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tasuku}
      POSTGRES_DB: ${DB_DATABASE:-tasuku}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tasuku" ]
      interval: 5s
      timeout: 5s
      retries: 5
    image: postgres:alpine
    networks:
      - tasuku
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tasuku-db:/var/lib/postgresql
networks:
  tasuku:
    name: tasuku
volumes:
  tasuku-db:
